<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dimsz-Api | Brutal</title>
    <link id="favicon" rel="icon" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        'brutal-bg': '#f5f0eb',
                        'brutal-dark': '#1a1a1a',
                        'brutal-accent': '#c1121f',
                        'brutal-yellow': '#f4d03f',
                    }
                }
            }
        }
    </script>
    <style>
        /* Reset & Base Brutalism */
        * { box-sizing: border-box; }
        body { 
            background: #ece6df; 
            font-family: 'Space Mono', monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            image-rendering: pixelated;
        }

        /* Brutalist Card */
        .brutal-card {
            background: #f5f0eb;
            border: 4px solid #1a1a1a;
            box-shadow: 12px 12px 0 0 #1a1a1a;
            max-width: 440px;
            width: 100%;
            transition: all 0.05s linear;
            position: relative;
        }

        /* Brutalist Elements */
        .brutal-border {
            border: 3px solid #1a1a1a;
        }

        .brutal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: #f5f0eb;
            color: #1a1a1a;
            border: 3px solid #1a1a1a;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            cursor: pointer;
            transition: all 0.06s linear;
            text-decoration: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 0 #1a1a1a;
        }

        .brutal-btn-primary {
            background: #c1121f;
            color: #f5f0eb;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            border-color: #1a1a1a;
        }

        .brutal-btn-primary:active {
            background: #a00f1a;
        }

        .brutal-btn-ai {
            background: #2a6f97;
            color: #f5f0eb;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            border-color: #1a1a1a;
        }

        .brutal-btn-ai:active {
            background: #1d4f6e;
        }

        .brutal-btn-icon {
            width: 54px;
            height: 54px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            background: #f5f0eb;
            border: 3px solid #1a1a1a;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            transition: all 0.06s linear;
            flex: 1;
            color: #1a1a1a;
        }

        .brutal-btn-icon:active {
            transform: translate(3px, 3px);
            box-shadow: 2px 2px 0 0 #1a1a1a;
        }

        .brutal-btn-icon:hover {
            background: #e8e0d8;
        }

        /* Thumbnail with retro filter */
        .brutal-thumb {
            border: 4px solid #1a1a1a;
            filter: contrast(1.1) saturate(0.9) brightness(0.95);
            image-rendering: crisp-edges;
            background: #d4cbc2;
        }

        .brutal-thumb-overlay {
            background: repeating-linear-gradient(
                45deg,
                rgba(0,0,0,0.02) 0px,
                rgba(0,0,0,0.02) 4px,
                rgba(0,0,0,0.04) 4px,
                rgba(0,0,0,0.04) 8px
            );
        }

        /* Shimmer retro */
        .shimmer-retro {
            background: repeating-linear-gradient(
                90deg,
                #d4cbc2 0px,
                #c4b8ad 20px,
                #d4cbc2 40px
            );
            background-size: 200% 100%;
            animation: shimmerRetro 1.2s steps(4) infinite;
        }
        @keyframes shimmerRetro {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }

        /* Divider */
        .brutal-divider {
            height: 4px;
            background: #1a1a1a;
            width: 60px;
            margin: 0.5rem auto;
        }

        /* Badge retro */
        .brutal-badge {
            background: #f4d03f;
            color: #1a1a1a;
            padding: 0.2rem 0.8rem;
            border: 2px solid #1a1a1a;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 3px 3px 0 0 #1a1a1a;
        }

        /* Dot retro */
        .brutal-dot {
            width: 14px;
            height: 14px;
            border: 2px solid #1a1a1a;
            background: #f5f0eb;
        }
        .brutal-dot-red { background: #c1121f; }
        .brutal-dot-yellow { background: #f4d03f; }
        .brutal-dot-green { background: #2b9348; }

        /* Scroll */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #d4cbc2; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border: 2px solid #d4cbc2; }
    </style>
</head>
<body>

    <div class="brutal-card">
        
        <!-- Top Bar - Retro Dots -->
        <div class="p-4 flex items-center justify-between border-b-4 border-brutal-dark bg-[#e8e0d8]">
            <div class="flex gap-3">
                <div class="brutal-dot brutal-dot-red"></div>
                <div class="brutal-dot brutal-dot-yellow"></div>
                <div class="brutal-dot brutal-dot-green"></div>
            </div>
            <div class="text-[10px] font-bold uppercase tracking-widest text-brutal-dark bg-[#f5f0eb] px-3 py-1 border-2 border-brutal-dark flex items-center gap-1.5">
                <i class="fa-solid fa-circle text-[8px] text-brutal-accent"></i> Live
            </div>
        </div>

        <div class="p-6 relative">
            
            <!-- Loader -->
            <div id="loader" class="flex flex-col gap-5">
                <div class="w-full aspect-[16/9] brutal-border shimmer-retro"></div>
                <div class="space-y-3 text-center">
                    <div class="h-7 w-2/3 shimmer-retro mx-auto brutal-border"></div>
                    <div class="h-4 w-16 shimmer-retro mx-auto brutal-border"></div>
                    <div class="h-4 w-full max-w-xs shimmer-retro mx-auto brutal-border"></div>
                </div>
                <div class="flex gap-3 mt-2">
                    <div class="h-14 w-1/2 shimmer-retro brutal-border"></div>
                    <div class="h-14 w-1/2 shimmer-retro brutal-border"></div>
                </div>
            </div>

            <!-- Content -->
            <div id="content" class="hidden">
                
                <!-- Thumbnail -->
                <div class="relative w-full aspect-[16/9] brutal-thumb overflow-hidden mb-6 shadow-[6px_6px_0_0_#1a1a1a]">
                    <div class="absolute inset-0 brutal-thumb-overlay z-10"></div>
                    <img id="dash-thumb" src="" alt="Cover" class="w-full h-full object-cover">
                    <div class="absolute bottom-3 left-3 z-20 brutal-badge flex items-center gap-1.5">
                        <i class="fa-solid fa-cassette-tape text-[10px]"></i> VHS
                    </div>
                </div>

                <!-- Texts -->
                <div class="text-center mb-7">
                    <h1 id="dash-title" class="text-3xl font-bold uppercase tracking-tight text-brutal-dark leading-none"></h1>
                    <div class="brutal-divider"></div>
                    <p id="dash-desc" class="text-sm text-brutal-dark/70 font-mono uppercase tracking-wider mt-2"></p>
                </div>

                <!-- Main Buttons -->
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <a href="/docs" class="brutal-btn brutal-btn-primary">
                        <i class="fa-solid fa-book-open"></i> Docs
                    </a>
                    <a href="/stats" class="brutal-btn">
                        <i class="fa-solid fa-chart-simple"></i> Stats
                    </a>
                    <a href="/dimsz-ai" class="brutal-btn brutal-btn-ai">
                        <i class="fa-solid fa-brain"></i> AI
                    </a>
                </div>

                <!-- Social Buttons -->
                <div class="flex gap-3 justify-center">
                    <a id="btn-channel" href="#" target="_blank" class="brutal-btn-icon">
                        <i class="fa-brands fa-whatsapp"></i>
                    </a>
                    <a id="btn-source" href="#" target="_blank" class="brutal-btn-icon">
                        <i class="fa-brands fa-github"></i>
                    </a>
                    <button onclick="share()" class="brutal-btn-icon">
                        <i class="fa-solid fa-share-nodes"></i>
                    </button>
                </div>

                <!-- Footer -->
                <div class="mt-8 pt-4 text-center border-t-4 border-brutal-dark/20">
                    <p class="text-[10px] font-bold uppercase tracking-[0.15em] text-brutal-dark/60 flex items-center justify-center gap-3">
                        <span class="w-6 h-[3px] bg-brutal-dark/30 inline-block"></span>
                        Powered by <span class="text-brutal-accent bg-[#f5f0eb] px-2 py-0.5 border-2 border-brutal-dark">Danzz</span>
                        <span class="w-6 h-[3px] bg-brutal-dark/30 inline-block"></span>
                    </p>
                    <p class="text-[10px] text-brutal-dark/40 mt-1.5 font-mono">// 2026 //</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        const minLoadTime = 700; 
        const startLoad = Date.now();

        function share() {
            if (navigator.share) {
                navigator.share({
                    title: document.title,
                    url: window.location.href
                }).catch(console.error);
            } else {
                navigator.clipboard.writeText(window.location.href);
                const btn = document.querySelector('button[onclick="share()"]');
                const icon = btn.querySelector('i');
                icon.className = 'fa-solid fa-check';
                setTimeout(() => { icon.className = 'fa-solid fa-share-nodes'; }, 1500);
            }
        }

        fetch('/config')
            .then(res => res.json())
            .then(config => {
                document.getElementById('dash-title').innerText = config.settings.apiName || 'DIMSZ-API';
                document.getElementById('dash-desc').innerText = config.settings.description || 'Retro Brutal Gateway';
                
                const btnChannel = document.getElementById('btn-channel');
                if(config.settings.channelUrl) btnChannel.href = config.settings.channelUrl;
                else btnChannel.style.display = 'none';

                const btnSource = document.getElementById('btn-source');
                if(config.settings.github) btnSource.href = config.settings.github;
                else btnSource.style.display = 'none';

                const thumbEl = document.getElementById('dash-thumb');
                thumbEl.src = config.settings.thumbnail || 'https://placehold.co/600x400/d4cbc2/1a1a1a?text=BRUTAL';
                thumbEl.onerror = () => { thumbEl.src = 'https://placehold.co/600x400/d4cbc2/1a1a1a?text=BRUTAL'; };

                if(config.settings.favicon) document.getElementById('favicon').href = config.settings.favicon;

                const elapsed = Date.now() - startLoad;
                const remaining = Math.max(0, minLoadTime - elapsed);

                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');
                }, remaining);
            })
            .catch(err => {
                console.warn('Config fetch failed, using fallback.', err);
                document.getElementById('dash-title').innerText = 'KURO-NEKO';
                document.getElementById('dash-desc').innerText = 'Brutalist Dashboard';
                
                setTimeout(() => {
                    document.getElementById('loader').classList.add('hidden');
                    document.getElementById('content').classList.remove('hidden');
                }, 800);
            });
    </script>
</body>
</html>
