<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dimsz-Api | Gateway</title>
    <link id="favicon" rel="icon" href="">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        'brutal-bg': '#f5f0eb',
                        'brutal-dark': '#1a1a1a',
                        'brutal-accent': '#c1121f',
                        'brutal-yellow': '#f4d03f',
                    }
                }
            }
        }
    </script>
    <style>
        /* Reset & Base Brutalism */
        * { box-sizing: border-box; }
        body { 
            background: #ece6df; 
            font-family: 'Space Mono', monospace;
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
            image-rendering: pixelated;
        }

        /* Brutalist Card */
        .brutal-card {
            background: #f5f0eb;
            border: 4px solid #1a1a1a;
            box-shadow: 12px 12px 0 0 #1a1a1a;
            max-width: 440px;
            width: 100%;
            transition: all 0.05s linear;
            position: relative;
        }

        /* Brutalist Elements */
        .brutal-border {
            border: 3px solid #1a1a1a;
        }

        .brutal-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.75rem 1.5rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            background: #f5f0eb;
            color: #1a1a1a;
            border: 3px solid #1a1a1a;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            cursor: pointer;
            transition: all 0.06s linear;
            text-decoration: none;
            width: 100%;
            height: 100%;
            position: relative;
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 0 #1a1a1a;
        }

        .brutal-btn-primary {
            background: #c1121f;
            color: #f5f0eb;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            border-color: #1a1a1a;
        }

        .brutal-btn-primary:active {
            background: #a00f1a;
        }

        .brutal-btn-ai {
            background: #2a6f97;
            color: #f5f0eb;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            border-color: #1a1a1a;
        }

        .brutal-btn-ai:active {
            background: #1d4f6e;
        }

        /* Thumbnail with retro filter */
        .brutal-thumb {
            border: 4px solid #1a1a1a;
            filter: contrast(1.1) saturate(0.9) brightness(0.95);
            image-rendering: crisp-edges;
            background: #d4cbc2;
        }

        .brutal-thumb-overlay {
            background: repeating-linear-gradient(
                45deg,
                rgba(0,0,0,0.02) 0px,
                rgba(0,0,0,0.02) 4px,
                rgba(0,0,0,0.04) 4px,
                rgba(0,0,0,0.04) 8px
            );
        }

        /* Divider */
        .brutal-divider {
            height: 4px;
            background: #1a1a1a;
            width: 60px;
            margin: 0.5rem auto;
        }

        /* Badge retro */
        .brutal-badge {
            background: #f4d03f;
            color: #1a1a1a;
            padding: 0.2rem 0.8rem;
            border: 2px solid #1a1a1a;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 3px 3px 0 0 #1a1a1a;
        }

        /* Dot retro */
        .brutal-dot {
            width: 14px;
            height: 14px;
            border: 2px solid #1a1a1a;
            background: #f5f0eb;
        }
        .brutal-dot-red { background: #c1121f; }
        .brutal-dot-yellow { background: #f4d03f; }
        .brutal-dot-green { background: #2b9348; }

        /* Scroll */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #d4cbc2; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border: 2px solid #d4cbc2; }

        /* ============ LOADING SYSTEM KEREN ============ */
        #loader-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2rem;
            padding: 2rem 1rem;
            min-height: 380px;
        }

        /* Loading Animation - Brutal Style */
        .loader-brutal {
            display: flex;
            gap: 12px;
            align-items: center;
        }

        .loader-brutal .block {
            width: 20px;
            height: 20px;
            background: #d4cbc2;
            border: 3px solid #1a1a1a;
            animation: blockPulse 1.2s ease-in-out infinite;
            transform: scale(1);
        }

        .loader-brutal .block:nth-child(1) { animation-delay: 0s; }
        .loader-brutal .block:nth-child(2) { animation-delay: 0.15s; }
        .loader-brutal .block:nth-child(3) { animation-delay: 0.3s; }
        .loader-brutal .block:nth-child(4) { animation-delay: 0.45s; }
        .loader-brutal .block:nth-child(5) { animation-delay: 0.6s; }

        @keyframes blockPulse {
            0%, 100% { 
                background: #d4cbc2;
                transform: scale(1);
            }
            50% { 
                background: #c1121f;
                transform: scale(1.2);
                box-shadow: 3px 3px 0 0 #1a1a1a;
            }
        }

        /* Progress Bar Brutal */
        .loader-progress {
            width: 100%;
            max-width: 280px;
            margin: 0 auto;
        }

        .loader-progress .track {
            width: 100%;
            height: 12px;
            background: #d4cbc2;
            border: 3px solid #1a1a1a;
            position: relative;
            overflow: hidden;
        }

        .loader-progress .track .fill {
            height: 100%;
            background: #c1121f;
            width: 0%;
            transition: width 0.15s cubic-bezier(0.22, 1, 0.36, 1);
            position: relative;
        }

        .loader-progress .track .fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: repeating-linear-gradient(
                90deg,
                transparent 0px,
                transparent 6px,
                rgba(255,255,255,0.15) 6px,
                rgba(255,255,255,0.15) 12px
            );
            animation: scanProgress 0.8s linear infinite;
        }

        @keyframes scanProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

        .loader-progress .label {
            display: flex;
            justify-content: space-between;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #1a1a1a;
            margin-top: 0.5rem;
        }

        .loader-progress .label .percent {
            color: #c1121f;
            font-size: 0.8rem;
        }

        /* Status Text */
        .loader-status {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            color: #8a7f75;
            min-height: 1.5rem;
            text-align: center;
            border-right: 2px solid #c1121f;
            padding-right: 4px;
            animation: blinkCursor 0.8s step-end infinite;
        }

        @keyframes blinkCursor {
            0%, 100% { border-color: #c1121f; }
            50% { border-color: transparent; }
        }

        .loader-status .highlight {
            color: #c1121f;
            font-weight: 700;
        }

        /* Content fade in */
        #content {
            animation: brutalFadeIn 0.6s cubic-bezier(0.22, 1, 0.36, 1) forwards;
        }

        @keyframes brutalFadeIn {
            0% { opacity: 0; transform: scale(0.98) translateY(12px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="brutal-card">
        
        <!-- Top Bar - Retro Dots -->
        <div class="p-4 flex items-center justify-between border-b-4 border-brutal-dark bg-[#e8e0d8]">
            <div class="flex gap-3">
                <div class="brutal-dot brutal-dot-red"></div>
                <div class="brutal-dot brutal-dot-yellow"></div>
                <div class="brutal-dot brutal-dot-green"></div>
            </div>
            <div class="text-[10px] font-bold uppercase tracking-widest text-brutal-dark bg-[#f5f0eb] px-3 py-1 border-2 border-brutal-dark flex items-center gap-1.5">
                <i class="fa-solid fa-circle text-[8px] text-brutal-accent"></i> Live
            </div>
        </div>

        <div class="p-6 relative">
            
            <!-- ============ LOADING SYSTEM KEREN ============ -->
            <div id="loader-wrapper">
                <!-- Logo / Icon -->
                <div class="text-center">
                    <div class="text-5xl mb-2 text-brutal-accent">⚡</div>
                    <div class="brutal-divider w-16 mx-auto"></div>
                </div>

                <!-- Blocks Animation -->
                <div class="loader-brutal">
                    <div class="block"></div>
                    <div class="block"></div>
                    <div class="block"></div>
                    <div class="block"></div>
                    <div class="block"></div>
                </div>

                <!-- Progress Bar -->
                <div class="loader-progress">
                    <div class="track">
                        <div class="fill" id="progress-fill" style="width: 0%;"></div>
                    </div>
                    <div class="label">
                        <span>Loading</span>
                        <span class="percent" id="progress-percent">0%</span>
                    </div>
                </div>

                <!-- Status Text -->
                <div class="loader-status" id="loader-status">
                    <span class="highlight">⟳</span> INITIALIZING SYSTEM...
                </div>
            </div>

            <!-- ============ CONTENT ============ -->
            <div id="content" class="hidden">
                
                <!-- Thumbnail -->
                <div class="relative w-full aspect-[16/9] brutal-thumb overflow-hidden mb-6 shadow-[6px_6px_0_0_#1a1a1a]">
                    <div class="absolute inset-0 brutal-thumb-overlay z-10"></div>
                    <img id="dash-thumb" src="" alt="Cover" class="w-full h-full object-cover">
                    <div class="absolute bottom-3 left-3 z-20 brutal-badge flex items-center gap-1.5">
                        <i class="fa-solid fa-cassette-tape text-[10px]"></i> VHS
                    </div>
                </div>

                <!-- Texts -->
                <div class="text-center mb-7">
                    <h1 id="dash-title" class="text-3xl font-bold uppercase tracking-tight text-brutal-dark leading-none"></h1>
                    <div class="brutal-divider"></div>
                    <p id="dash-desc" class="text-sm text-brutal-dark/70 font-mono uppercase tracking-wider mt-2"></p>
                </div>

                <!-- Main Buttons - Tanpa social buttons -->
                <div class="grid grid-cols-3 gap-4 mb-6">
                    <a href="/docs" class="brutal-btn brutal-btn-primary">
                        <i class="fa-solid fa-book-open"></i> Docs
                    </a>
                    <a href="/stats" class="brutal-btn">
                        <i class="fa-solid fa-chart-simple"></i> Stats
                    </a>
                    <a href="/dimsz-ai" class="brutal-btn brutal-btn-ai">
                        <i class="fa-solid fa-brain"></i> AI
                    </a>
                </div>

                <!-- Footer -->
                <div class="mt-8 pt-4 text-center border-t-4 border-brutal-dark/20">
                    <p class="text-[10px] font-bold uppercase tracking-[0.15em] text-brutal-dark/60 flex items-center justify-center gap-3">
                        <span class="w-6 h-[3px] bg-brutal-dark/30 inline-block"></span>
                        Powered by <span class="text-brutal-accent bg-[#f5f0eb] px-2 py-0.5 border-2 border-brutal-dark">Dimsz-Api</span>
                        <span class="w-6 h-[3px] bg-brutal-dark/30 inline-block"></span>
                    </p>
                    <p class="text-[10px] text-brutal-dark/40 mt-1.5 font-mono">// 2026 //</p>
                </div>

            </div>
        </div>
    </div>

    <script>
        // ============ LOADING SYSTEM ============
        const statusMessages = [
            { text: 'INITIALIZING SYSTEM...', progress: 5 },
            { text: 'LOADING CONFIGURATION...', progress: 15 },
            { text: 'CONNECTING TO SERVER...', progress: 25 },
            { text: 'FETCHING API DATA...', progress: 40 },
            { text: 'PARSING RESPONSE...', progress: 55 },
            { text: 'RENDERING DASHBOARD...', progress: 70 },
            { text: 'OPTIMIZING ASSETS...', progress: 85 },
            { text: 'READY!', progress: 100 }
        ];

        let currentIndex = 0;
        const progressFill = document.getElementById('progress-fill');
        const progressPercent = document.getElementById('progress-percent');
        const statusEl = document.getElementById('loader-status');
        const loaderWrapper = document.getElementById('loader-wrapper');
        const content = document.getElementById('content');

        function updateLoading() {
            if (currentIndex >= statusMessages.length) {
                // Selesai loading
                setTimeout(() => {
                    loaderWrapper.style.display = 'none';
                    content.classList.remove('hidden');
                }, 400);
                return;
            }

            const msg = statusMessages[currentIndex];
            const progress = msg.progress;
            
            // Update progress bar
            progressFill.style.width = progress + '%';
            progressPercent.textContent = progress + '%';
            
            // Update status text dengan efek typewriter
            const highlight = progress < 100 ? '⟳' : '✓';
            statusEl.innerHTML = `<span class="highlight">${highlight}</span> ${msg.text}`;
            
            // Glitch effect random
            if (Math.random() > 0.6) {
                statusEl.style.transform = `translate(${Math.random() * 4 - 2}px, ${Math.random() * 4 - 2}px)`;
                setTimeout(() => {
                    statusEl.style.transform = 'translate(0, 0)';
                }, 100);
            }

            currentIndex++;
            
            // Random delay antara 200-600ms biar natural
            const delay = 200 + Math.random() * 400;
            setTimeout(updateLoading, delay);
        }

        // ============ FETCH CONFIG ============
        const minLoadTime = 700; 
        const startLoad = Date.now();

        fetch('/config')
            .then(res => res.json())
            .then(config => {
                document.getElementById('dash-title').innerText = config.settings.apiName || 'DIMSZ-API';
                document.getElementById('dash-desc').innerText = config.settings.description || 'Retro Brutal Gateway';
                
                const thumbEl = document.getElementById('dash-thumb');
                thumbEl.src = config.settings.thumbnail || 'https://placehold.co/600x400/d4cbc2/1a1a1a?text=BRUTAL';
                thumbEl.onerror = () => { thumbEl.src = 'https://placehold.co/600x400/d4cbc2/1a1a1a?text=BRUTAL'; };

                if(config.settings.favicon) document.getElementById('favicon').href = config.settings.favicon;

                // Mulai loading setelah config siap
                setTimeout(() => {
                    updateLoading();
                }, 300);
            })
            .catch(err => {
                console.warn('Config fetch failed, using fallback.', err);
                document.getElementById('dash-title').innerText = 'KURO-NEKO';
                document.getElementById('dash-desc').innerText = 'Brutalist Dashboard';
                
                setTimeout(() => {
                    updateLoading();
                }, 300);
            });
    </script>
</body>
</html>
