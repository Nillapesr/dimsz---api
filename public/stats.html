<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dimsz-Api | Server Monitor</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        'brutal-bg': '#e8e0d8',
                        'brutal-dark': '#1a1a1a',
                        'brutal-accent': '#c1121f',
                        'brutal-yellow': '#f4d03f',
                        'brutal-blue': '#2a6f97',
                        'brutal-green': '#2b9348',
                        'brutal-orange': '#e85d04',
                    },
                    boxShadow: {
                        'brutal': '8px 8px 0 0 #1a1a1a',
                        'brutal-sm': '4px 4px 0 0 #1a1a1a',
                        'brutal-lg': '12px 12px 0 0 #1a1a1a',
                    },
                    animation: {
                        'blink': 'blink 1s step-end infinite',
                        'pulse-slow': 'pulseSlow 3s ease-in-out infinite',
                        'slide-in-right': 'slideInRight 0.4s ease-out forwards',
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                    },
                    keyframes: {
                        blink: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0' } },
                        pulseSlow: { '0%, 100%': { opacity: '0.3' }, '50%': { opacity: '0.6' } },
                        slideInRight: { '0%': { opacity: '0', transform: 'translateX(15px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                    },
                }
            }
        }
    </script>
    <style>
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            background: #e8e0d8;
            font-family: 'Space Mono', monospace;
        }

        #fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -50;
            background-color: #e8e0d8;
            background-image: url('https://c.termai.cc/i181/aGwK.png'), url('https://c.termai.cc/i155/wbV.jpg');
            background-position: bottom right, center center;
            background-size: 85% auto, cover;
            background-repeat: no-repeat;
            opacity: 0.5;
            filter: contrast(1.2) saturate(0.7);
        }
        @media (max-width: 768px) { #fixed-bg { background-size: 110% auto, cover; } }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #d4cbc2; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border: 2px solid #d4cbc2; }
        ::-webkit-scrollbar-thumb:hover { background: #c1121f; }

        /* Brutalist Core */
        .brutal-border {
            border: 3px solid #1a1a1a;
        }

        .brutal-shadow {
            box-shadow: 8px 8px 0 0 #1a1a1a;
        }

        .brutal-shadow-sm {
            box-shadow: 4px 4px 0 0 #1a1a1a;
        }

        .brutal-card {
            background: #f5f0eb;
            border: 4px solid #1a1a1a;
            box-shadow: 10px 10px 0 0 #1a1a1a;
        }

        .brutal-card-sm {
            background: #f5f0eb;
            border: 3px solid #1a1a1a;
            box-shadow: 6px 6px 0 0 #1a1a1a;
        }

        .brutal-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #f5f0eb;
            color: #1a1a1a;
            border: 3px solid #1a1a1a;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            cursor: pointer;
            transition: all 0.06s linear;
            text-decoration: none;
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 0 #1a1a1a;
        }

        .brutal-btn-primary {
            background: #c1121f;
            color: #f5f0eb;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            border-color: #1a1a1a;
        }

        .brutal-btn-primary:active {
            background: #a00f1a;
        }

        .brutal-dot {
            width: 14px;
            height: 14px;
            border: 2px solid #1a1a1a;
            background: #f5f0eb;
        }
        .brutal-dot-red { background: #c1121f; }
        .brutal-dot-yellow { background: #f4d03f; }
        .brutal-dot-green { background: #2b9348; }

        .brutal-badge {
            background: #f4d03f;
            color: #1a1a1a;
            padding: 0.2rem 0.8rem;
            border: 2px solid #1a1a1a;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 3px 3px 0 0 #1a1a1a;
        }

        .brutal-divider {
            height: 3px;
            background: #1a1a1a;
            width: 40px;
            margin: 0.5rem 0;
        }

        /* Terminal */
        .brutal-terminal {
            background: #1a1a1a;
            border: 4px solid #1a1a1a;
            box-shadow: 8px 8px 0 0 #1a1a1a;
        }

        .brutal-terminal-header {
            background: #2a2a2a;
            border-bottom: 3px solid #1a1a1a;
            padding: 0.6rem 1rem;
        }

        .brutal-terminal-body {
            background: #0f0f0f;
            color: #e2e8f0;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
        }

        /* Meter Bar Brutal */
        .meter-bar {
            transition: width 0.3s cubic-bezier(0.22, 1, 0.36, 1);
            background: repeating-linear-gradient(
                45deg,
                #c1121f 0px,
                #c1121f 4px,
                #1a1a1a 4px,
                #1a1a1a 8px
            );
        }

        .meter-bar-low {
            background: repeating-linear-gradient(
                45deg,
                #2b9348 0px,
                #2b9348 4px,
                #1a1a1a 4px,
                #1a1a1a 8px
            );
        }

        .meter-bar-medium {
            background: repeating-linear-gradient(
                45deg,
                #f4d03f 0px,
                #f4d03f 4px,
                #1a1a1a 4px,
                #1a1a1a 8px
            );
        }

        .meter-bar-high {
            background: repeating-linear-gradient(
                45deg,
                #c1121f 0px,
                #c1121f 4px,
                #1a1a1a 4px,
                #1a1a1a 8px
            );
        }

        .meter-grid {
            background-image: linear-gradient(to right, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 10% 100%;
        }

        /* Log entry */
        .log-entry {
            border-left: 3px solid transparent;
            padding-left: 0.5rem;
            transition: all 0.2s;
        }

        .log-entry:hover {
            border-left-color: #f4d03f;
            background: rgba(255,255,255,0.03);
        }

        .log-method-get { border-left-color: #2a6f97; }
        .log-method-post { border-left-color: #2b9348; }
        .log-method-delete { border-left-color: #c1121f; }
        .log-method-put { border-left-color: #e85d04; }
    </style>
</head>
<body class="text-brutal-dark min-h-screen flex flex-col font-mono antialiased">

    <div id="fixed-bg"></div>

    <!-- Navbar Brutal -->
    <nav class="bg-[#f5f0eb] border-b-4 border-brutal-dark sticky top-0 z-[60] w-full">
        <div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-4 justify-between">
            <div class="flex items-center gap-3 shrink-0">
                <a href="/" class="w-10 h-10 bg-[#f5f0eb] text-brutal-dark flex items-center justify-center border-3 border-brutal-dark shadow-brutal-sm hover:bg-brutal-accent hover:text-white transition-colors duration-200">
                    <i class="fa-solid fa-arrow-left"></i>
                </a>
                <div class="flex flex-col">
                    <h1 class="font-bold text-xl tracking-tight text-brutal-dark uppercase">DIMSZ-API</h1>
                    <span class="text-[9px] font-bold text-brutal-accent tracking-widest -mt-0.5">MONITOR</span>
                </div>
            </div>
            <a href="/docs" class="brutal-btn brutal-btn-primary text-xs px-4 py-2">
                <i class="fa-solid fa-book"></i> DOCS
            </a>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 py-6 grid gap-6">

        <!-- Stats Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            
            <!-- Uptime Card -->
            <div class="brutal-card-sm p-5 relative overflow-hidden">
                <div class="absolute -right-6 -top-6 w-20 h-20 bg-brutal-green/10 rotate-45"></div>
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-12 h-12 bg-[#f5f0eb] border-3 border-brutal-dark shadow-brutal-sm flex items-center justify-center text-xl text-brutal-green">
                        <i class="fa-solid fa-clock"></i>
                    </div>
                    <div>
                        <h3 class="text-[10px] font-bold text-brutal-dark/60 uppercase tracking-widest">Uptime</h3>
                        <p id="uptime" class="font-mono font-bold text-lg text-brutal-dark">Loading...</p>
                    </div>
                </div>
                <div class="w-full h-2 bg-[#d4cbc2] border-2 border-brutal-dark overflow-hidden">
                    <div class="h-full bg-brutal-green meter-bar-low w-full animate-pulse-slow"></div>
                </div>
            </div>

            <!-- Platform Card -->
            <div class="brutal-card-sm p-5 relative overflow-hidden">
                <div class="absolute -right-6 -top-6 w-20 h-20 bg-brutal-blue/10 rotate-45"></div>
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-12 h-12 bg-[#f5f0eb] border-3 border-brutal-dark shadow-brutal-sm flex items-center justify-center text-xl text-brutal-blue">
                        <i class="fa-solid fa-server"></i>
                    </div>
                    <div>
                        <h3 class="text-[10px] font-bold text-brutal-dark/60 uppercase tracking-widest">Platform</h3>
                        <p id="platform" class="font-mono font-bold text-lg text-brutal-dark">Loading...</p>
                    </div>
                </div>
                <div class="flex gap-2 text-[10px] font-bold">
                    <span id="arch" class="bg-[#f5f0eb] border-2 border-brutal-dark shadow-brutal-sm px-2 py-1">--</span>
                    <span id="node-ver" class="bg-[#f5f0eb] border-2 border-brutal-dark shadow-brutal-sm px-2 py-1">--</span>
                </div>
            </div>

            <!-- CPU Load Card -->
            <div class="brutal-card-sm p-5 relative overflow-hidden">
                <div class="absolute -right-6 -top-6 w-20 h-20 bg-brutal-accent/10 rotate-45"></div>
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-12 h-12 bg-[#f5f0eb] border-3 border-brutal-dark shadow-brutal-sm flex items-center justify-center text-xl text-brutal-accent">
                        <i class="fa-solid fa-microchip"></i>
                    </div>
                    <div>
                        <h3 class="text-[10px] font-bold text-brutal-dark/60 uppercase tracking-widest">CPU Load</h3>
                        <p id="cpu-load" class="font-mono font-bold text-lg text-brutal-dark">0%</p>
                    </div>
                </div>
                <p id="cpu-model" class="text-[10px] font-mono text-brutal-dark/60 truncate border-t-2 border-brutal-dark/20 pt-2">Detecting...</p>
            </div>
        </div>

        <!-- Memory Usage -->
        <div class="brutal-card p-6">
            <h2 class="text-lg font-bold text-brutal-dark mb-5 flex items-center gap-3">
                <span class="w-8 h-8 bg-[#f5f0eb] border-3 border-brutal-dark shadow-brutal-sm flex items-center justify-center text-brutal-accent">
                    <i class="fa-solid fa-memory"></i>
                </span>
                MEMORY USAGE
            </h2>
            <div class="mb-2 flex justify-between text-xs font-bold text-brutal-dark/60 font-mono">
                <span>USED: <span id="mem-used" class="text-brutal-dark">0 GB</span></span>
                <span>TOTAL: <span id="mem-total" class="text-brutal-dark">0 GB</span></span>
            </div>
            <div class="w-full h-10 bg-[#d4cbc2] border-3 border-brutal-dark overflow-hidden relative">
                <div id="ram-bar" class="h-full meter-bar w-0 flex items-center justify-end pr-3">
                    <span id="ram-percent" class="text-[11px] font-bold text-white drop-shadow-md">0%</span>
                </div>
                <div class="absolute inset-0 meter-grid pointer-events-none"></div>
            </div>
            <p class="text-right text-[10px] font-bold text-brutal-dark/60 mt-2">
                FREE: <span id="mem-free" class="text-brutal-dark">0 GB</span>
            </p>
        </div>

        <!-- Logs Terminal -->
        <div class="brutal-terminal">
            <div class="brutal-terminal-header flex items-center justify-between">
                <div class="flex gap-2 items-center">
                    <div class="brutal-dot brutal-dot-red"></div>
                    <div class="brutal-dot brutal-dot-yellow"></div>
                    <div class="brutal-dot brutal-dot-green"></div>
                    <span class="ml-2 text-slate-400 font-bold text-xs tracking-wider">REQUESTS LOG</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="text-[8px] text-slate-500 font-bold uppercase">Live</span>
                    <span class="w-2 h-2 bg-brutal-green border-2 border-brutal-dark animate-blink"></span>
                </div>
            </div>
            <div id="realtime-logs" class="p-4 text-gray-300 overflow-y-auto h-[280px] space-y-1 font-mono text-[11px] leading-relaxed">
                <div class="text-slate-500 italic">▸ Listening for requests...</div>
            </div>
        </div>

    </main>

    <footer class="text-center py-5 text-brutal-dark/60 text-[10px] border-t-4 border-brutal-dark/20 mt-4">
        <span class="text-brutal-accent font-bold">◼</span> 2026 <span class="text-brutal-dark font-bold">Dimsz-Api</span> · Brutal Monitor
    </footer>

    <script>
        const updateInterval = 1000;
        let lastRequestsJson = '';

        async function fetchStats() {
            try {
                const response = await fetch('/stats/data');
                const data = await response.json();
                
                if(data.status) {
                    const s = data.server;
                    document.getElementById('uptime').innerText = s.uptime;
                    document.getElementById('platform').innerText = s.hostname;
                    document.getElementById('arch').innerText = s.arch;
                    document.getElementById('node-ver').innerText = s.node_version;
                    document.getElementById('cpu-model').innerText = `${s.cpu.model} (${s.cpu.cores} Cores)`;
                    document.getElementById('cpu-load').innerText = (parseFloat(s.cpu.load) * 10).toFixed(1) + '%';
                    document.getElementById('mem-used').innerText = s.memory.used;
                    document.getElementById('mem-total').innerText = s.memory.total;
                    document.getElementById('mem-free').innerText = s.memory.free;
                    
                    const ramBar = document.getElementById('ram-bar');
                    const ramPct = document.getElementById('ram-percent');
                    const pct = s.memory.percent;
                    ramBar.style.width = `${pct}%`;
                    ramPct.innerText = `${pct}%`;
                    
                    // Update meter style based on percentage
                    if(pct > 85) {
                        ramBar.className = 'h-full meter-bar-high flex items-center justify-end pr-3';
                    } else if(pct > 60) {
                        ramBar.className = 'h-full meter-bar-medium flex items-center justify-end pr-3';
                    } else {
                        ramBar.className = 'h-full meter-bar-low flex items-center justify-end pr-3';
                    }
                    
                    const newRequestsJson = JSON.stringify(data.requests);
                    if (data.requests && newRequestsJson !== lastRequestsJson) {
                        lastRequestsJson = newRequestsJson;
                        renderLogs(data.requests);
                    }
                }
            } catch (e) { 
                console.error("Stats fetch error", e); 
            }
        }

        function renderLogs(logs) {
            const container = document.getElementById('realtime-logs');
            container.innerHTML = ''; 

            if (!logs || logs.length === 0) {
                container.innerHTML = '<div class="text-slate-500 italic">▸ Listening for requests...</div>';
                return;
            }

            logs.forEach(log => {
                const div = document.createElement('div');
                
                const match = log.match(/^\[([A-Z]+)\] \[(\d+)\] (.*)$/);
                
                if (match) {
                    const method = match[1];
                    const status = match[2];
                    const url = match[3];
                    
                    let methodClass = 'log-method-get';
                    let methodColor = 'text-sky-400';
                    if(method === 'POST') { methodClass = 'log-method-post'; methodColor = 'text-emerald-400'; }
                    if(method === 'DELETE') { methodClass = 'log-method-delete'; methodColor = 'text-red-400'; }
                    if(method === 'PUT') { methodClass = 'log-method-put'; methodColor = 'text-amber-400'; }
                    
                    let statusColor = 'text-emerald-400';
                    if(status.startsWith('4')) statusColor = 'text-amber-400';
                    if(status.startsWith('5')) statusColor = 'text-red-500';

                    div.className = `log-entry ${methodClass} break-all hover:bg-white/5 px-1 rounded transition-colors flex gap-2 text-[11px]`;
                    div.innerHTML = `
                        <span class="${methodColor} font-bold w-14 shrink-0">[${method}]</span>
                        <span class="${statusColor} font-bold w-12 shrink-0">[${status}]</span>
                        <span class="text-gray-300 truncate">${url}</span>
                    `;
                } else {
                    div.className = 'log-entry break-all text-slate-400';
                    div.innerText = `▸ ${log}`;
                }
                
                container.appendChild(div);
            });
            container.scrollTop = container.scrollHeight;
        }

        fetchStats();
        setInterval(fetchStats, updateInterval);
    </script>
</body>
</html>
