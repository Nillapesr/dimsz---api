<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dimsz-API — Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #08080a;
            color: #e4e4e7;
            min-height: 100vh;
        }
        .mono { font-family: 'JetBrains Mono', monospace; }
        
        /* GLASSMORPHISM */
        .glass {
            background: rgba(17, 17, 20, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .glass-light {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        
        /* ANIMATED GRADIENT BORDER */
        .gradient-border {
            position: relative;
            background: rgba(17, 17, 20, 0.8);
            border-radius: 16px;
            padding: 1px;
        }
        .gradient-border::before {
            content: '';
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            padding: 2px;
            background: conic-gradient(from var(--angle, 0deg), #6c3ce0, #a855f7, #6366f1, #6c3ce0);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            animation: spin 4s linear infinite;
        }
        @property --angle {
            syntax: '<angle>';
            initial-value: 0deg;
            inherits: false;
        }
        @keyframes spin {
            to { --angle: 360deg; }
        }

        /* SCROLLBAR */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #3f3f46; border-radius: 2px; }

        /* BUTTON */
        .btn-primary {
            background: #6c3ce0;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 12px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-primary:hover {
            background: #7a4de8;
            transform: scale(1.02);
        }
        .btn-outline {
            background: transparent;
            color: #a1a1aa;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 10px;
            font-weight: 600;
            font-size: 11px;
            padding: 8px 16px;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .btn-outline:hover {
            border-color: rgba(255,255,255,0.2);
            color: #fff;
        }

        /* INPUT */
        .dim-input {
            background: rgba(255,255,255,0.04);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 10px;
            padding: 10px 14px;
            font-size: 13px;
            color: #e4e4e7;
            outline: none;
            width: 100%;
            transition: border-color 0.2s;
            font-family: 'Inter', sans-serif;
        }
        .dim-input:focus {
            border-color: #6c3ce0;
        }
        .dim-input::placeholder {
            color: #3f3f46;
        }

        /* CATEGORY PILL */
        .cat-pill {
            font-size: 10px;
            font-weight: 600;
            padding: 4px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.06);
            background: transparent;
            color: #71717a;
            cursor: pointer;
            transition: all 0.15s;
            white-space: nowrap;
        }
        .cat-pill:hover {
            border-color: rgba(255,255,255,0.15);
            color: #e4e4e7;
        }
        .cat-pill.active {
            background: #6c3ce0;
            color: #fff;
            border-color: #6c3ce0;
        }

        /* ENDPOINT CARD */
        .endpoint-card {
            background: rgba(17, 17, 20, 0.6);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 16px 18px;
            transition: all 0.3s;
            cursor: pointer;
        }
        .endpoint-card:hover {
            border-color: rgba(255,255,255,0.12);
            transform: translateY(-2px);
        }

        /* RESPONSE BOX */
        .response-box {
            background: #0a0a0c;
            border-radius: 8px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 200px;
            overflow: auto;
            border: 1px solid rgba(255,255,255,0.04);
            margin-top: 8px;
            display: none;
        }
        .response-box.show {
            display: block;
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
            animation: pulse-dot 2s infinite;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <nav class="glass sticky top-0 z-50 border-b border-white/5">
        <div class="max-w-7xl mx-auto px-4 h-14 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-8 h-8 bg-gradient-to-br from-[#6c3ce0] to-[#a855f7] rounded-lg flex items-center justify-center text-white font-bold text-sm">D</div>
                <span class="font-bold text-lg text-white">Dimsz<span class="text-[#6c3ce0]">-API</span></span>
                <span class="text-[10px] text-white/30 mono hidden sm:inline">v1.0</span>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex items-center gap-2 text-xs text-white/40 mono">
                    <span class="status-dot bg-green-400"></span>
                    <span class="hidden sm:inline">Online</span>
                </div>
                <a href="/docs" class="text-xs text-white/40 hover:text-white/80 transition">Docs</a>
                <a href="/config" class="text-xs text-white/40 hover:text-white/80 transition">Config</a>
            </div>
        </div>
    </nav>

    <!-- HERO -->
    <header class="text-center py-12 px-4">
        <div class="max-w-2xl mx-auto">
            <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full border border-white/5 bg-white/5 text-xs text-white/40 mono mb-4">
                <span class="w-1.5 h-1.5 rounded-full bg-green-400 animate-pulse"></span>
                System Ready
            </div>
            <h1 class="text-4xl sm:text-5xl font-bold text-white mb-3">
                API <span class="text-[#6c3ce0]">Gateway</span>
            </h1>
            <p class="text-white/40 text-sm max-w-md mx-auto">
                Explore and test all available endpoints directly from this dashboard.
            </p>
        </div>
    </header>

    <!-- MAIN -->
    <main class="max-w-7xl mx-auto px-4 pb-20">

        <!-- STATS -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-8">
            <div class="glass rounded-xl p-4 text-center border border-white/5">
                <div class="text-2xl font-bold text-white" id="stat-total">0</div>
                <div class="text-[10px] text-white/30 mono">Endpoints</div>
            </div>
            <div class="glass rounded-xl p-4 text-center border border-white/5">
                <div class="text-2xl font-bold text-[#6c3ce0]" id="stat-categories">0</div>
                <div class="text-[10px] text-white/30 mono">Categories</div>
            </div>
            <div class="glass rounded-xl p-4 text-center border border-white/5">
                <div class="text-2xl font-bold text-white" id="stat-online">✅</div>
                <div class="text-[10px] text-white/30 mono">Status</div>
            </div>
            <div class="glass rounded-xl p-4 text-center border border-white/5">
                <div class="text-2xl font-bold text-white" id="stat-uptime">0s</div>
                <div class="text-[10px] text-white/30 mono">Uptime</div>
            </div>
        </div>

        <!-- SEARCH & FILTER -->
        <div class="flex flex-col sm:flex-row gap-3 mb-6">
            <div class="relative flex-1">
                <i class="fa-solid fa-search absolute left-3 top-1/2 -translate-y-1/2 text-white/20 text-xs"></i>
                <input type="text" id="search-input" placeholder="Search endpoints..." class="dim-input pl-9">
            </div>
            <div class="flex flex-wrap gap-2" id="category-filters">
                <button class="cat-pill active" data-cat="All">All</button>
            </div>
        </div>

        <!-- ENDPOINT GRID -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-3" id="endpoint-grid"></div>

        <!-- NO RESULTS -->
        <div id="no-results" class="hidden text-center py-12">
            <i class="fa-solid fa-magnifying-glass text-2xl text-white/10 mb-3"></i>
            <p class="text-white/20 text-sm">No endpoints found</p>
        </div>

    </main>

    <script>
        let allEndpoints = [];
        let currentCategory = 'All';

        // ===== FETCH ENDPOINTS =====
        async function loadEndpoints() {
            try {
                const res = await fetch('/config');
                const config = await res.json();
                const tags = config.tags || {};
                
                allEndpoints = [];
                for (const [category, endpoints] of Object.entries(tags)) {
                    endpoints.forEach(ep => {
                        allEndpoints.push({ ...ep, category });
                    });
                }

                document.getElementById('stat-total').textContent = allEndpoints.length;
                document.getElementById('stat-categories').textContent = Object.keys(tags).length;

                buildFilters();
                renderEndpoints();

                // Uptime counter
                let seconds = 0;
                setInterval(() => {
                    seconds++;
                    document.getElementById('stat-uptime').textContent = formatTime(seconds);
                }, 1000);

            } catch(e) {
                console.error('Gagal load config:', e);
            }
        }

        function formatTime(sec) {
            const h = String(Math.floor(sec / 3600)).padStart(2, '0');
            const m = String(Math.floor((sec % 3600) / 60)).padStart(2, '0');
            const s = String(sec % 60).padStart(2, '0');
            return `${h}:${m}:${s}`;
        }

        // ===== BUILD CATEGORY FILTERS =====
        function buildFilters() {
            const cats = ['All', ...new Set(allEndpoints.map(e => e.category))];
            const container = document.getElementById('category-filters');
            container.innerHTML = '';
            cats.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `cat-pill ${cat === 'All' ? 'active' : ''}`;
                btn.dataset.cat = cat;
                btn.textContent = cat;
                btn.onclick = () => filterCategory(cat);
                container.appendChild(btn);
            });
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-pill').forEach(p => {
                p.classList.toggle('active', p.dataset.cat === cat);
            });
            renderEndpoints();
        }

        // ===== RENDER ENDPOINTS =====
        function renderEndpoints() {
            const grid = document.getElementById('endpoint-grid');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filtered = allEndpoints.filter(e => {
                const matchCat = currentCategory === 'All' || e.category === currentCategory;
                const matchSearch = e.name.toLowerCase().includes(search) || e.endpoint.toLowerCase().includes(search);
                return matchCat && matchSearch;
            });

            const noResults = document.getElementById('no-results');
            if (filtered.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
            }

            grid.innerHTML = '';
            filtered.forEach((ep, i) => {
                const card = document.createElement('div');
                card.className = 'endpoint-card animate-fadeIn';
                card.style.animationDelay = `${i * 30}ms`;
                card.innerHTML = `
                    <div class="flex items-start justify-between gap-3">
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-2 flex-wrap">
                                <span class="text-[10px] font-bold text-white/30 mono bg-white/5 px-2 py-0.5 rounded">${ep.method || 'GET'}</span>
                                <span class="text-sm font-mono text-white/80 truncate">${ep.endpoint}</span>
                                ${ep.params?.length ? `<span class="text-[10px] text-white/20 mono">${ep.params.length} params</span>` : ''}
                            </div>
                            <div class="text-xs text-white/30 mt-0.5">${ep.name}</div>
                            <div class="text-[10px] text-white/15 mono mt-1">${ep.category}</div>
                        </div>
                        <button onclick="executeEndpoint('${ep.endpoint}', ${i})" class="btn-primary text-xs px-3 py-1.5 shrink-0">Execute</button>
                    </div>
                    <div id="response-${i}" class="response-box">Loading...</div>
                `;
                grid.appendChild(card);
            });
        }

        // ===== EXECUTE ENDPOINT =====
        async function executeEndpoint(endpoint, index) {
            const box = document.getElementById(`response-${index}`);
            box.classList.add('show');
            box.textContent = '⏳ Sending request...';

            try {
                const res = await fetch(endpoint);
                const data = await res.json();
                box.textContent = JSON.stringify(data, null, 2);
            } catch(e) {
                box.textContent = `❌ Error: ${e.message}`;
            }
        }

        // ===== SEARCH =====
        document.getElementById('search-input').addEventListener('input', renderEndpoints);

        // ===== INIT =====
        document.addEventListener('DOMContentLoaded', loadEndpoints);
    </script>

    <style>
        .animate-fadeIn {
            animation: fadeIn 0.3s ease-out both;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
