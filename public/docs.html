<head>

    <title>Dimsz-Api | Documents</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        mono: ['"Space Mono"', 'monospace'],
                    },
                    colors: {
                        'brutal-bg': '#e8e0d8',
                        'brutal-dark': '#1a1a1a',
                        'brutal-accent': '#c1121f',
                        'brutal-yellow': '#f4d03f',
                        'brutal-blue': '#2a6f97',
                        'brutal-green': '#2b9348',
                        'brutal-orange': '#e85d04',
                    },
                    boxShadow: {
                        'brutal': '8px 8px 0 0 #1a1a1a',
                        'brutal-sm': '4px 4px 0 0 #1a1a1a',
                        'brutal-lg': '12px 12px 0 0 #1a1a1a',
                    },
                    animation: {
                        'blink': 'blink 1s step-end infinite',
                        'slide-down': 'slideDown 0.3s ease-out forwards',
                        'marquee': 'marquee 20s linear infinite',
                        'slide-in-right': 'slideInRight 0.4s ease-out forwards',
                        'fade-in-up': 'fadeInUp 0.5s ease-out forwards',
                        'pulse-slow': 'pulseSlow 6s ease-in-out infinite',
                        'border-run': 'borderRun 1.5s linear infinite',
                    },
                    keyframes: {
                        blink: { '0%, 100%': { opacity: '1' }, '50%': { opacity: '0' } },
                        slideDown: { '0%': { opacity: '0', transform: 'translateY(-10px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        marquee: { '0%': { transform: 'translateX(100%)' }, '100%': { transform: 'translateX(-200%)' } },
                        slideInRight: { '0%': { opacity: '0', transform: 'translateX(15px)' }, '100%': { opacity: '1', transform: 'translateX(0)' } },
                        fadeInUp: { '0%': { opacity: '0', transform: 'translateY(15px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } },
                        pulseSlow: { '0%, 100%': { opacity: '0.3', transform: 'scale(1)' }, '50%': { opacity: '0.6', transform: 'scale(1.2)' } },
                        borderRun: {
                            '0%': { backgroundPosition: '0% 0%' },
                            '100%': { backgroundPosition: '200% 0%' },
                        },
                    },
                }
            }
        }
    </script>
    <style>
        html, body {
            max-width: 100vw;
            overflow-x: hidden;
            width: 100%;
            position: relative;
            background: #e8e0d8;
            font-family: 'Space Mono', monospace;
        }

        #fixed-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -50;
            background-color: #e8e0d8;
            background-image: url('https://c.termai.cc/i181/aGwK.png'), url('https://c.termai.cc/i155/wbV.jpg');
            background-position: bottom right, center center;
            background-size: 85% auto, cover;
            background-repeat: no-repeat;
            opacity: 0.6;
            filter: contrast(1.2) saturate(0.7);
        }
        @media (max-width: 768px) {
            #fixed-bg { background-size: 110% auto, cover; }
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: #d4cbc2; }
        ::-webkit-scrollbar-thumb { background: #1a1a1a; border: 2px solid #d4cbc2; }
        ::-webkit-scrollbar-thumb:hover { background: #c1121f; }

        /* Brutalist Core Styles */
        .brutal-border {
            border: 3px solid #1a1a1a;
        }

        .brutal-shadow {
            box-shadow: 8px 8px 0 0 #1a1a1a;
        }

        .brutal-shadow-sm {
            box-shadow: 4px 4px 0 0 #1a1a1a;
        }

        .brutal-card {
            background: #f5f0eb;
            border: 4px solid #1a1a1a;
            box-shadow: 10px 10px 0 0 #1a1a1a;
        }

        .brutal-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.6rem 1.2rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            background: #f5f0eb;
            color: #1a1a1a;
            border: 3px solid #1a1a1a;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            cursor: pointer;
            transition: all 0.06s linear;
            text-decoration: none;
            position: relative;
        }

        .brutal-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 1px 1px 0 0 #1a1a1a;
        }

        .brutal-btn-primary {
            background: #c1121f;
            color: #f5f0eb;
            box-shadow: 5px 5px 0 0 #1a1a1a;
            border-color: #1a1a1a;
        }

        .brutal-btn-primary:active {
            background: #a00f1a;
        }

        .brutal-btn-icon {
            width: 48px;
            height: 48px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #f5f0eb;
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0 0 #1a1a1a;
            transition: all 0.06s linear;
            flex: 1;
            color: #1a1a1a;
        }

        .brutal-btn-icon:active {
            transform: translate(3px, 3px);
            box-shadow: 1px 1px 0 0 #1a1a1a;
        }

        .brutal-btn-icon:hover {
            background: #e8e0d8;
        }

        .brutal-dot {
            width: 14px;
            height: 14px;
            border: 2px solid #1a1a1a;
            background: #f5f0eb;
        }
        .brutal-dot-red { background: #c1121f; }
        .brutal-dot-yellow { background: #f4d03f; }
        .brutal-dot-green { background: #2b9348; }

        .brutal-badge {
            background: #f4d03f;
            color: #1a1a1a;
            padding: 0.2rem 0.8rem;
            border: 2px solid #1a1a1a;
            font-size: 0.6rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            box-shadow: 3px 3px 0 0 #1a1a1a;
        }

        .brutal-divider {
            height: 4px;
            background: #1a1a1a;
            width: 60px;
            margin: 0.5rem auto;
        }

        /* Terminal Brutal */
        .brutal-terminal {
            background: #1a1a1a;
            border: 4px solid #1a1a1a;
            box-shadow: 8px 8px 0 0 #1a1a1a;
        }

        .brutal-terminal-header {
            background: #2a2a2a;
            border-bottom: 3px solid #1a1a1a;
            padding: 0.6rem 1rem;
        }

        .brutal-terminal-body {
            background: #0f0f0f;
            color: #e2e8f0;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
        }

        .brutal-input {
            background: #f5f0eb;
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0 0 #1a1a1a;
            padding: 0.6rem 1rem 0.6rem 2.8rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.8rem;
            color: #1a1a1a;
            width: 100%;
            outline: none;
            transition: all 0.06s linear;
        }

        .brutal-input:focus {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0 0 #1a1a1a;
        }

        .brutal-input::placeholder {
            color: #8a7f75;
        }

        /* Category Button - Tanpa efek spin, pakai border run */
        .brutal-cat-btn {
            background: #f5f0eb;
            border: 3px solid #1a1a1a;
            box-shadow: 6px 6px 0 0 #1a1a1a;
            transition: all 0.06s linear;
            cursor: pointer;
            width: 100%;
            text-align: left;
            padding: 0.8rem 1.2rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.9rem;
            color: #1a1a1a;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: relative;
            overflow: hidden;
        }

        .brutal-cat-btn:active {
            transform: translate(4px, 4px);
            box-shadow: 2px 2px 0 0 #1a1a1a;
        }

        /* Efek border running di pinggir button - lebih keren! */
        .brutal-cat-btn::before {
            content: '';
            position: absolute;
            inset: -3px;
            z-index: 0;
            background: linear-gradient(
                90deg,
                transparent 0%,
                #c1121f 20%,
                #f4d03f 40%,
                #2a6f97 60%,
                #c1121f 80%,
                transparent 100%
            );
            background-size: 200% 100%;
            opacity: 0;
            transition: opacity 0.3s ease;
            border-radius: 2px;
        }

        .brutal-cat-btn.animating::before {
            opacity: 1;
            animation: borderRun 1.2s linear infinite;
        }

        .brutal-cat-btn .cat-content {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
        }

        .brutal-cat-btn .arrow {
            transition: transform 0.2s ease;
            position: relative;
            z-index: 1;
        }
        .brutal-cat-btn .arrow.open {
            transform: rotate(180deg);
        }

        /* Card endpoint */
        .brutal-endpoint {
            background: #f5f0eb;
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0 0 #1a1a1a;
            margin-bottom: 0.75rem;
            transition: all 0.06s linear;
            overflow: hidden;
        }

        .brutal-endpoint-header {
            padding: 0.6rem 1rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem;
            border-bottom: 3px solid transparent;
            transition: border-color 0.2s;
        }

        .brutal-endpoint-header:hover {
            border-bottom-color: #1a1a1a;
        }

        .brutal-method {
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.65rem;
            padding: 0.2rem 0.6rem;
            border: 2px solid #1a1a1a;
            background: #f5f0eb;
            color: #1a1a1a;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            min-width: 48px;
            text-align: center;
        }

        .brutal-method-get { background: #2a6f97; color: white; }
        .brutal-method-post { background: #2b9348; color: white; }
        .brutal-method-put { background: #e85d04; color: white; }
        .brutal-method-delete { background: #c1121f; color: white; }

        .brutal-endpoint-body {
            padding: 1rem;
            border-top: 3px solid #1a1a1a;
            background: #ece6df;
        }

        .brutal-response {
            background: #1a1a1a;
            border: 3px solid #1a1a1a;
            box-shadow: 4px 4px 0 0 #1a1a1a;
            margin-top: 0.75rem;
            overflow: hidden;
        }

        .brutal-response-header {
            background: #2a2a2a;
            padding: 0.4rem 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 2px solid #1a1a1a;
        }

        .brutal-response-body {
            padding: 0.8rem;
            font-family: 'Space Mono', monospace;
            font-size: 0.7rem;
            color: #e2e8f0;
            max-height: 200px;
            overflow-y: auto;
            background: #0f0f0f;
        }

        /* Status indicator */
        .brutal-status {
            display: inline-block;
            width: 10px;
            height: 10px;
            border: 2px solid #1a1a1a;
            margin-right: 0.5rem;
        }
        .brutal-status-success { background: #2b9348; }
        .brutal-status-error { background: #c1121f; }
        .brutal-status-waiting { background: #f4d03f; }
        .brutal-status-idle { background: #8a7f75; }

        /* JSON Syntax Highlighting Brutal */
        .json-key { color: #f87171; font-weight: 700; }
        .json-string { color: #a3e635; }
        .json-number { color: #60a5fa; font-weight: 700; }
        .json-boolean { color: #c084fc; font-style: italic; }
        .json-null { color: #94a3b8; }

        .brutal-search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #8a7f75;
            font-size: 1rem;
        }

        /* Toast */
        .brutal-toast {
            background: #f5f0eb;
            border: 3px solid #1a1a1a;
            box-shadow: 8px 8px 0 0 #1a1a1a;
            padding: 0.8rem 1.5rem;
            font-family: 'Space Mono', monospace;
            font-weight: 700;
            font-size: 0.8rem;
            color: #1a1a1a;
        }

        /* No results */
        .brutal-empty {
            border: 4px dashed #1a1a1a;
            background: #f5f0eb;
            padding: 3rem 1rem;
            text-align: center;
        }

        #reminder-bar.show-bar {
            display: block;
            animation: slideDownReminder 0.4s ease-out;
        }
        @keyframes slideDownReminder {
            from { transform: translateY(-100%); opacity: 0; }
            to   { transform: translateY(0); opacity: 1; }
        }

        /* Typewriter effect for terminal */
        .typewriter {
            overflow: hidden;
            white-space: nowrap;
            border-right: 2px solid #f4d03f;
            animation: blink 0.8s step-end infinite;
        }
    </style>
</head>

    <script>
        document.addEventListener('DOMContentLoaded', init);
        let globalConfig = null;
        let toastTimeout;

        function isMobileDevice() { return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent); }

        async function init() {
            if (isMobileDevice()) document.body.classList.add('is-mobile');
            if (document.getElementById('term-logs')) {
                try {
                    const response = await fetch('/config');
                    globalConfig = await response.json();
                    setUi(globalConfig);
                    loadEnd(globalConfig.tags);
                    startWIBClock();
                    await kuroneko(globalConfig);
                    loadReminder();
                    setSearch();
                } catch (e) {
                    document.getElementById('term-logs').innerHTML = `<span class="text-red-400 font-bold">✖ SYSTEM FAILURE</span><br>${e.message}`;
                }
            }
        }

        function startWIBClock() {
            const timeEl = document.getElementById('server-time');
            const dateEl = document.getElementById('server-date');
            updateTime(); setInterval(updateTime, 1000);
            function updateTime() {
                const now = new Date();
                if(timeEl) timeEl.innerText = now.toLocaleTimeString('id-ID', {timeZone: 'Asia/Jakarta', hour12: false});
                if(dateEl) dateEl.innerText = now.toLocaleDateString('id-ID', {timeZone: 'Asia/Jakarta', day: '2-digit', month: 'short', year: 'numeric'});
            }
        }

        async function loadReminder() {
            try {
                const req = await fetch('/src/reminder.json');
                const data = await req.json();

                const runningText = document.getElementById('running-text');
                if (data?.message) {
                    runningText.innerHTML = `<span class="text-brutal-accent mr-2">▶</span> ${data.message.toUpperCase()}`;
                } else {
                    runningText.innerHTML = `<span class="text-brutal-accent mr-2">▶</span> DIMSZ-API • SYSTEM ONLINE • BRUTAL MODE ACTIVE`;
                }

                const bar = document.getElementById('reminder-bar');
                const textEl = document.getElementById('reminder-text');
                const closeBtn = document.getElementById('close-reminder');

                if (!bar || !textEl || !closeBtn) return;

                if (data?.barMessage) {
                    const dismissed = localStorage.getItem('reminder-dismissed');
                    if (dismissed === data.barMessage) {
                        bar.classList.add('hidden');
                        bar.classList.remove('show-bar');
                        return;
                    }

                    textEl.innerText = data.barMessage;
                    bar.classList.remove('hidden');
                    bar.classList.add('show-bar');

                    closeBtn.onclick = () => {
                        bar.classList.remove('show-bar');
                        bar.classList.add('hidden');
                        localStorage.setItem('reminder-dismissed', data.barMessage);
                    };
                } else {
                    bar.classList.add('hidden');
                    bar.classList.remove('show-bar');
                }
            } catch (e) {
                const bar = document.getElementById('reminder-bar');
                if (bar) {
                    bar.classList.add('hidden');
                    bar.classList.remove('show-bar');
                }
                const runningText = document.getElementById('running-text');
                if (runningText) runningText.innerHTML = `<span class="text-brutal-accent mr-2">▶</span> DIMSZ-API • SYSTEM ONLINE`;
            }
        }

        function terminalLog(message, type = 'info') {
            const logs = document.getElementById('term-logs');
            if(!logs) return;
            const line = document.createElement('div');
            let color = "text-slate-300";
            if(type === 'error') color = "text-red-400";
            else if(type === 'success') color = "text-emerald-400";
            else if(type === 'warn') color = "text-amber-400";
            else if(type === 'cmd') color = "text-white font-bold";
            else if(type === 'system') color = "text-slate-500";
            line.className = `${color} break-all font-mono text-xs`;
            line.innerHTML = message;
            logs.appendChild(line);
            logs.scrollTop = logs.scrollHeight;
        }

        async function kuroneko(config) {
            const logs = document.getElementById('term-logs');
            if(!logs) return;
            
            const cmdLine = document.createElement('div');
            cmdLine.className = 'text-slate-300 break-all font-mono text-xs';
            cmdLine.innerHTML = '<span class="text-green-400">➜</span> <span class="text-blue-400">~</span> ';
            const typeSpan = document.createElement('span');
            typeSpan.className = 'text-white font-bold';
            cmdLine.appendChild(typeSpan);
            logs.appendChild(cmdLine);

            const commandText = "npm run dev";
            for(let i=0; i < commandText.length; i++) {
                typeSpan.textContent += commandText.charAt(i);
                await new Promise(r => setTimeout(r, 60)); 
            }

            await new Promise(r => setTimeout(r, 400));
            const ver = config.settings.apiVersion || '1.0.0';
            terminalLog(`> dimsz-api@${ver} dev`, 'system');
            terminalLog(`> ts-node src/index.ts`, 'system');
            await new Promise(r => setTimeout(r, 600));
            terminalLog(``, 'system'); 

            terminalLog(`[INFO] Starting Server Instance...`, 'info');
            await new Promise(r => setTimeout(r, 300));
            terminalLog(`[INFO] Environment: Production`, 'info');
            terminalLog(`[DB] Connected to MongoDB Atlas`, 'success');
            await new Promise(r => setTimeout(r, 300));

            const allRoutes = [];
            for (const cat in config.tags) {
                config.tags[cat].forEach(r => allRoutes.push({cat, ...r}));
            }

            for(const route of allRoutes) {
                const methodColor = route.method === 'GET' ? 'text-sky-400' : route.method === 'POST' ? 'text-emerald-400' : 'text-amber-400';
                terminalLog(`[+] <span class="${methodColor} font-bold w-12 inline-block">${route.method}</span> ${route.endpoint} <span class="text-slate-600">✓</span>`, 'info');
                await new Promise(r => setTimeout(r, 15)); 
            }
            
            await new Promise(r => setTimeout(r, 400));
            terminalLog(``, 'system');
            terminalLog(`[✓] Server running on https://api-dimsz.myvnc.com/`, 'success');
            terminalLog(`[WATCH] Watching for changes...`, 'warn');
            
            const container = document.getElementById('api-container');
            if(container) {
                container.classList.remove('opacity-0', 'translate-y-4');
                container.classList.add('animate-fade-in-up');
            }
            document.getElementById('term-input-line').classList.remove('hidden');
        }

        function setUi(config) {
            const s = config.settings;
            if(document.getElementById('nav-title')) document.getElementById('nav-title').innerText = s.apiName || 'DIMSZ-API';
            if(document.getElementById('stat-visitors')) {
                document.getElementById('stat-visitors').innerText = s.visitors || '1';
                animateCounter('stat-visitors', 0, parseInt(s.visitors) || 1, 2000);
            }
            if (s.favicon) {
                let link = document.querySelector("link[rel~='icon']") || document.createElement('link');
                link.rel = 'icon'; link.href = s.favicon;
                document.head.appendChild(link);
            }
        }

        function animateCounter(elementId, start, end, duration) {
            const element = document.getElementById(elementId);
            if (!element) return;
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const value = Math.floor(progress * (end - start) + start);
                element.innerText = value.toLocaleString('id-ID');
                if (progress < 1) window.requestAnimationFrame(step);
            };
            window.requestAnimationFrame(step);
        }

        function setSearch() {
            const input = document.getElementById('search-input');
            const noResults = document.getElementById('no-results');
            if(!input) return;
            input.addEventListener('input', (e) => {
                const val = e.target.value.toLowerCase();
                if (val === '') {
                    document.querySelectorAll('.api-section').forEach(section => {
                        section.classList.remove('hidden'); 
                        section.querySelector('.api-section-grid').classList.remove('hidden'); 
                        section.querySelector('.arrow').classList.remove('open'); 
                        section.querySelectorAll('.brutal-endpoint').forEach(c => c.classList.remove('hidden')); 
                    });
                    if(noResults) noResults.classList.add('hidden');
                    return;
                }
                let anyVisible = false;
                document.querySelectorAll('.api-section').forEach(section => {
                    const grid = section.querySelector('.api-section-grid');
                    const arrow = section.querySelector('.arrow');
                    let match = 0;
                    section.querySelectorAll('.brutal-endpoint').forEach(card => {
                        const txt = card.getAttribute('data-search').toLowerCase();
                        if (txt.includes(val)) { 
                            card.classList.remove('hidden');
                            card.classList.add('animate-slide-in-right');
                            setTimeout(() => card.classList.remove('animate-slide-in-right'), 500);
                            match++; 
                        } else { 
                            card.classList.add('hidden'); 
                        }
                    });
                    if (match > 0) {
                        section.classList.remove('hidden');
                        grid.classList.remove('hidden'); 
                        grid.classList.add('animate-fade-in-up');
                        arrow.classList.add('open');
                        anyVisible = true;
                    } else {
                        section.classList.add('hidden');
                    }
                });
                if(noResults) {
                    noResults.classList.toggle('hidden', anyVisible);
                    noResults.classList.toggle('flex', !anyVisible);
                    if(!anyVisible) noResults.classList.add('animate-fade-in-up');
                }
            });
        }

        function loadEnd(tags) {
            const container = document.getElementById('api-container');
            if(!container) return;
            container.innerHTML = '';

            for (const [cat, routes] of Object.entries(tags)) {
                const catId = `cat-${cat.replace(/\s+/g, '-')}`;
                const section = document.createElement('div');
                section.className = "api-section w-full animate-fade-in-up";
                section.style.animationDelay = `${Object.keys(tags).indexOf(cat) * 0.1}s`;
                
                section.innerHTML = `
                    <button onclick="toggleCategory('${catId}')" class="brutal-cat-btn w-full">
                        <span class="cat-content">
                            <span class="flex items-center gap-3">
                                <i class="fa-solid fa-folder-open text-brutal-accent"></i>
                                ${cat}
                                <span class="text-[10px] bg-brutal-dark text-[#f5f0eb] px-2 py-0.5 border-2 border-brutal-dark shadow-brutal-sm">${routes.length}</span>
                            </span>
                            <i id="arrow-${catId}" class="arrow fa-solid fa-chevron-down text-brutal-dark/50"></i>
                        </span>
                    </button>
                    <div id="grid-${catId}" class="api-section-grid grid grid-cols-1 gap-3 hidden mt-4 pl-1 w-full"></div>
                `;
                
                const grid = section.querySelector('.api-section-grid');
                
                routes.forEach((route, idx) => {
                    const id = `${cat}-${idx}`.replace(/\s+/g, '-');
                    const methodClass = route.method === 'GET' ? 'brutal-method-get' : 
                                      route.method === 'POST' ? 'brutal-method-post' : 
                                      route.method === 'PUT' ? 'brutal-method-put' : 'brutal-method-delete';
                    
                    let inputs = '';
                    let copyUrl = route.endpoint;
                    if (route.method === 'GET' && route.params && route.params.length > 0) {
                        const paramsList = route.params.map(p => `${p.name}=`).join('&');
                        copyUrl = `${route.endpoint}?${paramsList}`;
                    }

                    if (route.params?.length) {
                        inputs = `<div class="bg-[#d4cbc2] p-4 border-t-3 border-brutal-dark grid gap-3 w-full">` + 
                        route.params.map(p => `
                        <div class="min-w-0">
                            <label class="text-[10px] font-bold text-brutal-dark tracking-wide mb-1 block">${p.name} ${p.required?'<span class="text-brutal-accent">*</span>':''}</label>
                            <input type="text" id="input-${id}-${p.name}" 
                                placeholder="${p.description ? p.description : 'Enter value...'}" 
                                class="w-full border-3 border-brutal-dark p-2 text-sm bg-[#f5f0eb] shadow-brutal-sm focus:outline-none focus:translate-x-1 focus:translate-y-1 transition-all">
                        </div>`).join('') + `</div>`;
                    }

                    const card = document.createElement('div');
                    card.className = 'brutal-endpoint w-full';
                    card.setAttribute('data-search', `${route.name} ${route.endpoint} ${cat}`);
                    
                    card.innerHTML = `
                        <div class="brutal-endpoint-header" onclick="toggle('${id}')">
                            <div class="flex items-center gap-3 overflow-hidden flex-1">
                                <span class="brutal-method ${methodClass} shrink-0">${route.method}</span>
                                <div class="flex flex-col min-w-0">
                                    <code class="font-bold text-sm truncate text-brutal-dark">${route.endpoint}</code>
                                    <span class="text-[10px] text-brutal-dark/60 truncate">${route.name}</span>
                                </div>
                            </div>
                            <i id="icon-${id}" class="fa-solid fa-chevron-right text-brutal-dark/30 transition-transform duration-300"></i>
                        </div>
                        
                        <div id="body-${id}" class="brutal-endpoint-body hidden">
                            ${inputs}
                            <div class="flex gap-3 items-center">
                                <button onclick="testReq(this, '${route.endpoint}', '${route.method}', '${id}')" class="brutal-btn brutal-btn-primary flex-1 text-xs">
                                    <i class="fa-solid fa-play"></i> EXECUTE
                                </button>
                                <button onclick="copy('${copyUrl}')" class="brutal-btn-icon w-12 h-12" title="Copy URL">
                                    <i class="fa-regular fa-copy"></i>
                                </button>
                            </div>

                            <div id="res-area-${id}" class="brutal-response hidden">
                                <div class="brutal-response-header">
                                    <div class="flex items-center gap-2">
                                        <span id="status-indicator-${id}" class="brutal-status brutal-status-idle"></span>
                                        <span id="status-${id}" class="text-[10px] font-bold text-slate-400">IDLE</span>
                                        <span class="text-slate-600">|</span>
                                        <span id="time-${id}" class="text-[10px] font-mono text-slate-400">0ms</span>
                                    </div>
                                    <div class="flex gap-2">
                                        <a id="dl-btn-${id}" class="hidden text-slate-400 hover:text-white cursor-pointer"><i class="fa-solid fa-download text-xs"></i></a>
                                        <button onclick="copyRes('${id}')" class="text-slate-400 hover:text-white"><i class="fa-regular fa-clone text-xs"></i></button>
                                        <button onclick="reset('${id}')" class="text-slate-400 hover:text-red-400"><i class="fa-solid fa-xmark text-sm"></i></button>
                                    </div>
                                </div>
                                <div class="brutal-response-body">
                                    <div class="flex items-center gap-2 mb-2 text-slate-500 border-b border-slate-800 pb-2 text-[10px]">
                                        <span class="text-green-400 font-bold">➜</span>
                                        <span class="text-slate-500">curl -X ${route.method}</span>
                                        <span class="text-sky-300 break-all">${route.endpoint}</span>
                                    </div>
                                    <div id="output-${id}" class="text-slate-300 break-all whitespace-pre-wrap leading-relaxed"></div>
                                </div>
                            </div>
                        </div>`;
                    grid.appendChild(card);
                });
                container.appendChild(section);
            }
        }

        window.toggleCategory = (catId) => {
            const grid = document.getElementById(`grid-${catId}`);
            const arrow = document.getElementById(`arrow-${catId}`);
            const btn = document.querySelector(`[onclick="toggleCategory('${catId}')"]`);
            
            // Efek border running di pinggir button - tanpa muter!
            if(btn) {
                btn.classList.add('animating');
                setTimeout(() => btn.classList.remove('animating'), 600);
            }
            
            if(grid.classList.contains('hidden')) { 
                grid.classList.remove('hidden'); 
                grid.classList.add('animate-fade-in-up');
                arrow.classList.add('open');
            } else { 
                grid.classList.add('hidden'); 
                arrow.classList.remove('open');
            }
        };
        
        window.toggle = (id) => {
            const b = document.getElementById(`body-${id}`);
            const i = document.getElementById(`icon-${id}`);
            if (b.classList.contains('hidden')) { 
                b.classList.remove('hidden'); 
                b.classList.add('animate-slide-down');
                i.classList.add('rotate-90');
            } else { 
                b.classList.add('hidden'); 
                i.classList.remove('rotate-90');
            }
        };
        
        window.copy = (txt) => { 
            navigator.clipboard.writeText(window.location.origin + txt); 
            showToast("URL COPIED"); 
        };
        
        window.copyRes = (id) => { 
            const out = document.getElementById(`output-${id}`); 
            if (out.innerText) { 
                navigator.clipboard.writeText(out.innerText); 
                showToast("RESPONSE COPIED"); 
            }
        };
        
        window.reset = (id) => { 
            const resArea = document.getElementById(`res-area-${id}`);
            resArea.classList.add('hidden');
            document.getElementById(`output-${id}`).innerHTML = ''; 
            document.getElementById(`status-indicator-${id}`).className = 'brutal-status brutal-status-idle';
            document.getElementById(`time-${id}`).innerText = '0ms';
            document.getElementById(`status-${id}`).innerText = 'IDLE';
        };

        function showToast(msg) {
            const toast = document.getElementById('custom-toast');
            const msgBox = document.getElementById('toast-message');
            if(!toast || !msgBox) return;
            msgBox.innerText = msg;
            toast.classList.remove('translate-y-32', 'opacity-0');
            toast.classList.add('animate-fade-in-up');
            if (toastTimeout) clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => { 
                toast.classList.add('translate-y-32', 'opacity-0');
                toast.classList.remove('animate-fade-in-up');
            }, 3000);
        }

        function typewriterEffect(elementId, text, speed = 10) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            let i = 0;
            function typeWriter() {
                if (i < text.length) {
                    element.innerHTML += text.charAt(i);
                    i++;
                    setTimeout(typeWriter, speed);
                }
            }
            typeWriter();
        }

        function syntaxHighlight(json) {
            if (typeof json != 'string') json = JSON.stringify(json, undefined, 2);
            return json.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
            .replace(/("(\\u[a-zA-Z0-9]{4}|\\[^u]|[^\\"])*"(\s*:)?|\b(true|false|null)\b|-?\d+(?:\.\d*)?(?:[eE][+\-]?\d+)?)/g, function (match) {
                let cls = 'json-number';
                if (/^"/.test(match)) {
                    if (/:$/.test(match)) cls = 'json-key';
                    else cls = 'json-string';
                } else if (/true|false/.test(match)) cls = 'json-boolean';
                else if (/null/.test(match)) cls = 'json-null';
                return `<span class="${cls}">${match}</span>`;
            });
        }

        window.testReq = async (btn, url, method, id) => {
            if (btn.disabled) return;
            const out = document.getElementById(`output-${id}`);
            const status = document.getElementById(`status-${id}`);
            const time = document.getElementById(`time-${id}`);
            const dlBtn = document.getElementById(`dl-btn-${id}`);
            const resArea = document.getElementById(`res-area-${id}`);
            const statusIndicator = document.getElementById(`status-indicator-${id}`);
            
            const originalText = btn.innerHTML;
            btn.disabled = true; 
            btn.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> RUNNING';

            resArea.classList.remove('hidden');
            statusIndicator.className = 'brutal-status brutal-status-waiting';
            status.innerText = 'RUNNING...'; 
            status.className = 'text-[10px] font-bold text-amber-400';

            const params = {};
            document.querySelectorAll(`[id^="input-${id}-"]`).forEach(i => { 
                if(i.value) {
                    params[i.id.split(`input-${id}-`)[1]] = i.value;
                    i.classList.add('border-brutal-green');
                    setTimeout(() => i.classList.remove('border-brutal-green'), 800);
                }
            });
            
            let fetchUrl = url + (method === 'GET' && Object.keys(params).length ? '?' + new URLSearchParams(params) : '');
            let opts = { 
                method, 
                ...(method !== 'GET' ? { headers: {'Content-Type': 'application/json'}, body: JSON.stringify(params) } : {}) 
            };
            
            terminalLog(`REQ: ${method} ${fetchUrl}`, 'warn');

            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                const elapsed = Date.now() - startTime;
                time.innerText = `${elapsed}ms`;
            }, 30); 

            try {
                const req = await fetch(fetchUrl, opts);
                
                clearInterval(timerInterval);
                const duration = Date.now() - startTime;
                animateCounter(`time-${id}`, duration - 50 > 0 ? duration - 50 : 0, duration, 200);
                
                if (req.ok) {
                    statusIndicator.className = 'brutal-status brutal-status-success';
                    status.innerText = `${req.status} OK`;
                    status.className = 'text-[10px] font-bold text-emerald-400';
                } else {
                    statusIndicator.className = 'brutal-status brutal-status-error';
                    status.innerText = `${req.status} ERROR`;
                    status.className = 'text-[10px] font-bold text-red-400';
                }

                terminalLog(`RES: [${req.status}] ${fetchUrl}`, req.ok ? 'success' : 'error');

                const type = req.headers.get('content-type');
                if (type?.includes('json')) {
                    const json = await req.json();
                    out.innerHTML = syntaxHighlight(json);
                } else if (type?.startsWith('image')) {
                    const blob = await req.blob();
                    const urlObj = URL.createObjectURL(blob);
                    dlBtn.href = urlObj; 
                    dlBtn.download = `img-${Date.now()}.jpg`; 
                    dlBtn.classList.remove('hidden');
                    out.innerHTML = `<div class="flex justify-center p-2">
                                        <img src="${urlObj}" class="max-w-full border-3 border-brutal-dark max-h-[300px]">
                                     </div>`;
                } else {
                    const text = await req.text();
                    typewriterEffect(`output-${id}`, text, 8);
                }
            } catch (err) {
                clearInterval(timerInterval);
                const duration = Date.now() - startTime;
                time.innerText = `${duration}ms`;
                statusIndicator.className = 'brutal-status brutal-status-error';
                terminalLog(`ERR: ${err.message}`, 'error');
                status.innerText = 'ERROR'; 
                status.className = 'text-[10px] font-bold text-red-400';
                out.innerHTML = `<span class="text-red-400 font-bold">${err.message}</span>`;
            } finally {
                btn.disabled = false; 
                btn.innerHTML = originalText;
            }
        };
    </script>
</body>
</html>
